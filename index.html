<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Semáforo PRO V4</title>
<script src="https://cdn.jsdelivr.net/npm/tesseract.js@5/dist/tesseract.min.js"></script>
<style>
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#000;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
#camera,#frozen{position:fixed;inset:0;width:100%;height:100%;object-fit:cover;background:#000}
#frozen{display:none}
#shade{position:fixed;inset:0;z-index:2;background:linear-gradient(180deg,rgba(0,0,0,.08),transparent 55%,rgba(0,0,0,.18));pointer-events:none}
#top{position:fixed;z-index:10;top:calc(env(safe-area-inset-top) + 10px);left:10px;right:10px;text-align:center}
#status{display:inline-block;background:rgba(0,0,0,.78);color:#fff;padding:9px 15px;border-radius:22px;font-size:14px;font-weight:800}
#box{position:fixed;z-index:5;left:4%;right:4%;top:17%;height:60%;border:2px solid rgba(255,255,255,.9);border-radius:22px;pointer-events:none}
#scan{position:fixed;z-index:20;left:50%;bottom:calc(112px + env(safe-area-inset-bottom));transform:translateX(-50%);width:76px;height:76px;border:0;border-radius:50%;background:#10c94b;color:#fff;font-size:29px;box-shadow:0 5px 22px rgba(0,0,0,.5)}
#scan:disabled{opacity:.5}
#bottom{position:fixed;z-index:10;left:10px;right:10px;bottom:calc(9px + env(safe-area-inset-bottom));min-height:78px;padding:10px 14px;border-radius:22px;background:rgba(0,0,0,.92);color:#fff;text-align:center}
#answer{height:42px;display:flex;align-items:center;justify-content:center}
#answer .lamp{width:38px;height:38px;border-radius:50%;display:block;box-shadow:0 0 18px currentColor}
#detail{margin-top:5px;font-size:13px;color:#ddd}
.green{color:#18df5c}.white{color:#fff}.yellow{color:#ffd21b}.orange{color:#ff9518}.red{color:#ff3030}
#debug{position:fixed;left:8px;right:8px;bottom:calc(100px + env(safe-area-inset-bottom));z-index:9;display:none;background:rgba(0,0,0,.75);color:#fff;border-radius:12px;padding:7px;font-size:11px}
</style>
</head>
<body>
<video id="camera" autoplay playsinline muted></video>
<canvas id="frozen"></canvas>
<div id="shade"></div><div id="box"></div>
<div id="top"><span id="status">Abriendo cámara…</span></div>
<button id="scan" disabled>📷</button>
<div id="bottom"><div id="answer" class="white">LISTO</div><div id="detail">Pulsa 📷 cuando aparezca una oferta.</div></div>
<div id="debug"></div>

<script>
const video=document.getElementById('camera'), frozen=document.getElementById('frozen');
const scan=document.getElementById('scan'), status=document.getElementById('status');
const answer=document.getElementById('answer'), detail=document.getElementById('detail');

let stream=null, worker=null, busy=false, ready=false;

const R={
 VERDE:{cls:'green',rank:0,h:300,k:11},
 BLANCO:{cls:'white',rank:1,h:250,k:10},
 AMARILLO:{cls:'yellow',rank:2,h:215,k:9},
 NARANJA:{cls:'orange',rank:3,h:200,k:8},
 ROJO:{cls:'red',rank:4,h:0,k:0}
};

function num(s){
 s=String(s).replace(/\s/g,'');
 if(s.includes('.')&&s.includes(','))s=s.replace(/,/g,'');
 else s=s.replace(',','.');
 return Number(s);
}
function price(text){
 const m=text.match(/\$\s*([0-9]{1,5}(?:[.,][0-9]{1,2})?)/);
 return m?num(m[1]):null;
}
function legs(text){
 // Parser tolerante para Uber y DiDi. No depende de que exista
 // parentesis, ni de que min/km queden en la misma linea.
 let s=String(text)
   .replace(/[|]/g,'1')
   .replace(/[\u00a0]/g,' ')
   .replace(/m\s*in/gi,'min')
   .replace(/k\s*m/gi,'km')
   .replace(/m\.\s*in/gi,'min')
   .replace(/k\.\s*m/gi,'km')
   .replace(/\s*([•·])\s*/g,' $1 ')
   .replace(/\n+/g,' ')
   .replace(/\s+/g,' ');
 const out=[];
 const seen=new Set();

 // 1) Formato habitual: 5 min (1.3 km), 5min 1.3km, 5 min · 1.3 km
 const r1=/(\d{1,3})\s*min\s*(?:\([^)]*?\s*)?[•·\-,:]?\s*([0-9]{1,4}(?:[.,][0-9]+)?)\s*km/gi;
 let m;
 while((m=r1.exec(s))){
   const mi=num(m[1]),km=num(m[2]);
   if(mi>0&&mi<=300&&km>0&&km<=500){
     const key=mi+'|'+km;if(!seen.has(key)){out.push({mi,km});seen.add(key);}
   }
 }

 // 2) Algunos formatos de DiDi ponen primero "X min" y después
 // "Y km" con texto intermedio (p.ej. etiquetas de recogida/viaje).
 const r2=/(\d{1,3})\s*min\b[\s\S]{0,90}?(\d{1,4}(?:[.,][0-9]+)?)\s*km\b/gi;
 while((m=r2.exec(s))){
   const mi=num(m[1]),km=num(m[2]);
   if(mi>0&&mi<=300&&km>0&&km<=500){
     const key=mi+'|'+km;if(!seen.has(key)){out.push({mi,km});seen.add(key);}
   }
 }

 // 3) Si OCR separa el texto en dos columnas: "5 min" ... "1.3 km".
 const r3=/(\d{1,3})\s*min\b[\s\S]{0,180}?(\d{1,4}(?:[.,][0-9]+)?)\s*km\b/gi;
 while((m=r3.exec(s))){
   const mi=num(m[1]),km=num(m[2]);
   if(mi>0&&mi<=300&&km>0&&km<=500){
     const key=mi+'|'+km;if(!seen.has(key)){out.push({mi,km});seen.add(key);}
   }
 }

 // Mantener solo los dos primeros tramos reales.
 return out.slice(0,2);
}
function classifyHour(v){
 if(v>=300)return R.VERDE;if(v>=250)return R.BLANCO;if(v>=215)return R.AMARILLO;if(v>=200)return R.NARANJA;return R.ROJO;
}
function classifyKm(v){
 if(v>=11)return R.VERDE;if(v>=10)return R.BLANCO;if(v>=9)return R.AMARILLO;if(v>=8)return R.NARANJA;return R.ROJO;
}
function finalColor(a,b){return a.rank>b.rank?a:b}

function preprocess(){
 const w=video.videoWidth,h=video.videoHeight;
 if(!w||!h)throw Error('camera-not-ready');
 const maxW=1500,scale=Math.min(1,maxW/w);
 const c=document.createElement('canvas');c.width=Math.round(w*scale);c.height=Math.round(h*scale);
 const x=c.getContext('2d',{willReadFrequently:true});
 x.drawImage(video,0,0,c.width,c.height);
 const im=x.getImageData(0,0,c.width,c.height),d=im.data;
 // Escala de grises + contraste suave. NO recorta: así no perdemos la tarjeta por orientación del video.
 for(let i=0;i<d.length;i+=4){
   const y=d[i]*.299+d[i+1]*.587+d[i+2]*.114;
   const v=Math.max(0,Math.min(255,(y-128)*1.28+128));
   d[i]=d[i+1]=d[i+2]=v;
 }
 x.putImageData(im,0,0);
 return c;
}

async function init(){
 try{
  stream=await navigator.mediaDevices.getUserMedia({
   video:{facingMode:{ideal:'environment'},width:{ideal:1280},height:{ideal:1280}},
   audio:false
  });
  video.srcObject=stream;await video.play();
  status.textContent='Cámara lista · pulsa 📷';
  scan.disabled=false;

  // Preparar OCR en segundo plano; no bloquea la cámara.
  worker=await Tesseract.createWorker('spa',1);
  await worker.setParameters({
   tessedit_pageseg_mode:'11',
   preserve_interword_spaces:'1',
   user_defined_dpi:'180'
  });
  ready=true;
  status.textContent='Cámara lista · pulsa 📷';
 }catch(e){
  console.error(e);status.textContent='No se pudo iniciar la cámara';
 }
}

async function scanNow(){
 if(busy)return;
 busy=true;scan.disabled=true;status.textContent='Leyendo oferta…';
 try{
  if(!ready){
   status.textContent='Preparando lector…';
   while(!ready)await new Promise(r=>setTimeout(r,50));
  }
  const img=preprocess();
  let text=(await worker.recognize(img)).data.text;
  let p=price(text), L=legs(text);

  // Segunda lectura SOLO si faltan los dos tramos. Usa la imagen original,
  // porque algunos teléfonos destruyen los grises de letras con el contraste.
  if(p===null||L.length<2){
   const w=video.videoWidth,h=video.videoHeight;
   const c=document.createElement('canvas');c.width=w;c.height=h;
   c.getContext('2d').drawImage(video,0,0,w,h);
   text=(await worker.recognize(c)).data.text;
   p=price(text);L=legs(text);
  }

  if(p===null||L.length<2){
   answer.textContent='LISTO';answer.className='white';
   detail.textContent='No leí completa · vuelve a pulsar 📷';
   status.textContent='No leí la oferta completa · 📷 otra vez';
   return;
  }

  // LOS DOS TRAMOS, siempre: recogida + viaje.
  const totalMin=L[0].mi+L[1].mi;
  const totalKm=L[0].km+L[1].km;
  if(!(totalMin>0&&totalKm>0))throw Error('bad-total');

  const porHora=p*60/totalMin, porKm=p/totalKm;
  const c=finalColor(classifyHour(porHora),classifyKm(porKm));

  const colorName=c===R.VERDE?'VERDE':c===R.BLANCO?'BLANCO':c===R.AMARILLO?'AMARILLO':c===R.NARANJA?'NARANJA':'ROJO';
  answer.innerHTML=`<span class="lamp" aria-label="${colorName}"></span>`;
  answer.className=c.cls;
  answer.querySelector('.lamp').style.background =
    c===R.VERDE?'#18df5c':c===R.BLANCO?'#fff':c===R.AMARILLO?'#ffd21b':c===R.NARANJA?'#ff9518':'#ff3030';
  detail.textContent=`$${p.toFixed(2)} · ${totalMin} min · ${totalKm.toFixed(2)} km`;
  status.textContent='Resultado congelado · 📷 siguiente oferta';

  // Congelar inmediatamente. La cámara deja de procesar hasta el siguiente toque.
  const w=video.videoWidth,h=video.videoHeight;
  frozen.width=w;frozen.height=h;frozen.getContext('2d').drawImage(video,0,0,w,h);
  frozen.style.display='block';video.style.display='none';
  if(stream){stream.getTracks().forEach(t=>t.stop());stream=null}
 }catch(e){
  console.error(e);status.textContent='No leí la oferta · 📷 otra vez';
  answer.textContent='LISTO';answer.className='white';
  detail.textContent='Pulsa 📷 para intentar nuevamente.';
 }finally{
  busy=false;scan.disabled=false;
 }
}

async function next(){
 if(video.style.display==='none'){
  frozen.style.display='none';video.style.display='block';
  try{
   stream=await navigator.mediaDevices.getUserMedia({video:{facingMode:{ideal:'environment'},width:{ideal:1280},height:{ideal:1280}},audio:false});
   video.srcObject=stream;await video.play();
   status.textContent='Cámara lista · pulsa 📷';
  }catch(e){status.textContent='No se pudo reactivar la cámara'}
 } 
 scanNow();
}
scan.addEventListener('click',next);
init();
</script>
</body></html>
